<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" fill="none">
  <rect width="600" height="375" fill="#181A20"/>
  <rect x="20" y="20" width="560" height="335" rx="12" stroke="#2E333D" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- Neutral SUV Silhouette -->
  <g transform="translate(70, 70)" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Body outline -->
    <path d="M 40 160 L 70 120 L 150 110 L 220 50 L 340 50 L 390 110 L 430 130 L 440 160 L 410 160 A 35 35 0 0 0 340 160 L 170 160 A 35 35 0 0 0 100 160 Z" fill="#262B35"/>
    <!-- Windows -->
    <path d="M 160 105 L 225 58 L 335 58 L 375 105 Z" fill="#1E232B" stroke="#64748B" stroke-width="1.5"/>
    <line x1="260" y1="58" x2="260" y2="105" stroke="#64748B" stroke-width="1.5"/>
    <!-- Wheels -->
    <circle cx="135" cy="160" r="26" fill="#0F172A" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="135" cy="160" r="12" fill="#334155"/>
    <circle cx="375" cy="160" r="26" fill="#0F172A" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="375" cy="160" r="12" fill="#334155"/>
    <!-- Ground line -->
    <line x1="20" y1="188" x2="450" y2="188" stroke="#334155" stroke-width="1"/>
  </g>
  <!-- Technical info & Neutral marker -->
  <rect x="36" y="36" width="140" height="24" rx="4" fill="#2E333D"/>
  <text x="44" y="52" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">DÒNG SUV ĐIỆN</text>
  <rect x="424" y="315" width="140" height="24" rx="4" fill="#B45309" fill-opacity="0.2" stroke="#B45309" stroke-width="1"/>
  <text x="436" y="331" fill="#FBBF24" font-family="sans-serif" font-size="11" font-weight="600">● ẢNH MINH HOẠ</text>
</svg>