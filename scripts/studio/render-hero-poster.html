<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thong Dong — Hero Car Poster Studio (Offline Renderer)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: #F2F3F5;
      display: flex;
      flex-direction: column;
    }
    #viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }
    .btn {
      padding: 6px 12px;
      border: 1px solid #d1d5db;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn.active {
      background: #B45309;
      color: #fff;
      border-color: #B45309;
    }
    #status {
      font-family: monospace;
      font-size: 12px;
      color: #4b5563;
    }
    .bg-grid {
      background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                        linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .bg-light { background-color: #F2F3F5 !important; background-image: none !important; }
    .bg-dark { background-color: #090D14 !important; background-image: none !important; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-light">
  <div id="toolbar">
    <strong>Hero Car Studio</strong>
    <span id="status">Đang khởi tạo WebGL...</span>
    <button class="btn active" id="btn-composite" onclick="window.switchMode('composite')">Composite (Xe + Bóng)</button>
    <button class="btn" id="btn-body" onclick="window.switchMode('body')">Chỉ thân xe</button>
    <button class="btn" id="btn-shadow" onclick="window.switchMode('shadow')">Chỉ bóng đổ</button>
    <button class="btn" onclick="toggleBg()">Đổi nền Preview</button>
  </div>

  <div id="viewport">
    <canvas id="render-canvas"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MeshoptDecoder } from '/public/libs/meshopt/meshopt_decoder.module.js';

    window.__ready = false;
    window.__mode = 'composite';

    const canvas = document.getElementById('render-canvas');
    const statusEl = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      premultipliedAlpha: false,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance'
    });

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
    
    // Low 3/4 front view matching premium automotive showcases
    camera.position.set(3.8, 1.15, 3.4);
    const cameraTarget = new THREE.Vector3(0, 0.38, 0);
    camera.lookAt(cameraTarget);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(cameraTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting setup for studio showroom
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfffbf0, 2.6);
    keyLight.position.set(4.5, 7.5, 3.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 4096;
    keyLight.shadow.mapSize.height = 4096;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.camera.left = -4;
    keyLight.shadow.camera.right = 4;
    keyLight.shadow.camera.top = 4;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.bias = -0.0001;
    keyLight.shadow.normalBias = 0.02;
    keyLight.shadow.radius = 3;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xdce7ff, 1.4);
    fillLight.position.set(-5, 4, -3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 2.0);
    rimLight.position.set(-2, 5, 5);
    scene.add(rimLight);

    const underGlow = new THREE.DirectionalLight(0xffffff, 0.4);
    underGlow.position.set(0, -2, 0);
    scene.add(underGlow);

    // Ground plane with ShadowMaterial for contact shadow
    const groundGeo = new THREE.PlaneGeometry(16, 16);
    const shadowMat = new THREE.ShadowMaterial({ opacity: 0.52 });
    const groundMesh = new THREE.Mesh(groundGeo, shadowMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = 0;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    let carGroup = null;
    let carMeshes = [];

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);

    statusEl.textContent = 'Đang nạp mô hình Carrera 4S...';
    loader.load(
      '/public/models/porsche_911_carrera_4s_opt.glb',
      (gltf) => {
        carGroup = gltf.scene;

        // Auto center and align vehicle to ground
        const bbox = new THREE.Box3().setFromObject(carGroup);
        const center = bbox.getCenter(new THREE.Vector3());
        const size = bbox.getSize(new THREE.Vector3());
        
        carGroup.position.x = -center.x;
        carGroup.position.y = -bbox.min.y; // ground bottom of wheels to Y=0
        carGroup.position.z = -center.z;

        carGroup.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            carMeshes.push(child);

            // Enhance automotive materials if needed
            if (child.material) {
              child.material.envMapIntensity = 1.2;
              if (child.material.name === 'paint') {
                // High gloss automotive clearcoat
                child.material.roughness = 0.22;
                child.material.metalness = 0.75;
                if ('clearcoat' in child.material) {
                  child.material.clearcoat = 1.0;
                  child.material.clearcoatRoughness = 0.05;
                }
              }
            }
          }
        });

        scene.add(carGroup);
        statusEl.textContent = 'Mô hình đã sẵn sàng (' + carMeshes.length + ' meshes).';

        // Warm up and render frames
        renderer.render(scene, camera);
        setTimeout(() => {
          renderer.render(scene, camera);
          window.__ready = true;
          statusEl.textContent = 'Sẵn sàng kết xuất ảnh chất lượng cao!';
        }, 300);
      },
      undefined,
      (err) => {
        console.error(err);
        statusEl.textContent = 'Lỗi nạp mô hình: ' + err.message;
      }
    );

    window.switchMode = function(mode) {
      window.__mode = mode;
      document.querySelectorAll('#toolbar .btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + mode);
      if (activeBtn) activeBtn.classList.add('active');

      if (!carGroup) return;

      if (mode === 'body') {
        // Car visible, ground hidden
        carGroup.visible = true;
        carMeshes.forEach(m => { m.material.colorWrite = true; });
        groundMesh.visible = false;
      } else if (mode === 'shadow') {
        // Only shadow: ground visible, car invisible to camera but casts shadow
        carGroup.visible = true;
        carMeshes.forEach(m => { m.material.colorWrite = false; });
        groundMesh.visible = true;
      } else if (mode === 'composite') {
        // Both car and shadow visible
        carGroup.visible = true;
        carMeshes.forEach(m => { m.material.colorWrite = true; });
        groundMesh.visible = true;
      }

      renderer.render(scene, camera);
    };

    window.captureDataUrl = function(width, height) {
      const origWidth = renderer.domElement.width;
      const origHeight = renderer.domElement.height;

      if (width && height) {
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');

      if (width && height) {
        renderer.setSize(origWidth, origHeight, false);
        camera.aspect = origWidth / origHeight;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      return dataUrl;
    };

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    window.addEventListener('resize', resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    const bgClasses = ['bg-light', 'bg-dark', 'bg-grid'];
    let currentBg = 0;
    window.toggleBg = function() {
      document.body.classList.remove(...bgClasses);
      currentBg = (currentBg + 1) % bgClasses.length;
      document.body.classList.add(bgClasses[currentBg]);
    };
  </script>
</body>
</html>
